<!DOCTYPE html>
<html lang="en">

<!--
    Particles thanks to ParticleJS
    https://github.com/VincentGarreau/particles.js/

    Typewriter thanks to Typewriter.js
    https://github.com/tameemsafi/typewriterjs
-->

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gyanendra Pandey</title>

    <!-- Typewriter.js -->
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>

    <style>
        body {
            padding: 0;
            margin: 0;
            background-color: #0d1116;
            overflow: hidden;
        }

        /* Particles Background */
        #particles-js {
            width: 800px;
            height: 387px;
            background-color: #0d1116;

            position: absolute;
            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            border: 1px solid purple;
            opacity: 0.9;

            z-index: 0;
        }

        /* Main Heading */
        #typewriter {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -60px);

            width: 90%;

            font-size: 3rem;
            line-height: 3.5rem;

            color: #fff;

            text-align: center;

            font-family: Arial, sans-serif;
            font-weight: 600;

            z-index: 10;

            background: linear-gradient(
                90deg,
                #5115b9,
                #e010e3
            );

            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Sub Heading */
        #typewriter2 {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, 20px);

            width: 90%;

            font-size: 1.5rem;
            line-height: 2.5rem;

            color: #fff;

            text-align: center;

            font-family: Arial, sans-serif;
            font-weight: 500;

            z-index: 10;

            background: linear-gradient(
                90deg,
                #5115b9,
                #fa00ff
            );

            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {

            #particles-js {
                width: 90%;
                height: 350px;
            }

            #typewriter {
                font-size: 2rem;
                line-height: 2.5rem;
            }

            #typewriter2 {
                font-size: 1rem;
                line-height: 1.8rem;
            }
        }
    </style>
</head>

<body>

    <!-- Main Typewriter Text -->
    <div id="typewriter"></div>

    <!-- Secondary Typewriter Text -->
    <div id="typewriter2"></div>

    <!-- Particles Background -->
    <div id="particles-js"></div>

    <!-- Particles.js -->
    <script src="particles.js"></script>

    <script>

        /* =========================
           PARTICLES
        ========================= */

        particlesJS.load(
            'particles-js',
            'assets/particles.json',
            function () {
                console.log('Particles configuration loaded');
            }
        );


        /* =========================
           MAIN TYPEWRITER
        ========================= */

        new Typewriter('#typewriter', {
            delay: 20,
        })

        .typeString('Hey there, I\'m Gyanendra 👋')

        .pauseFor(3000)

        .deleteAll(10)

        .typeString('Aspiring Full Stack Developer 👨‍💻')

        .pauseFor(3000)

        .deleteAll(10)

        .typeString('Exploring AI/ML 🤖')

        .pauseFor(3000)

        .deleteAll(10)

        .typeString('Building, Learning & Creating 🚀')

        .pauseFor(4000)

        .start();


        /* =========================
           SECOND TYPEWRITER
        ========================= */

        new Typewriter('#typewriter2', {
            delay: 20,
        })

        .pauseFor(1000)

        .typeString('Nice to meet you.')

        .pauseFor(2000)

        .deleteAll(10)

        .pauseFor(1000)

        .typeString('HTML, CSS, JavaScript, React, Node.js, Next.js.')

        .pauseFor(2000)

        .deleteAll(10)

        .typeString('Python, Machine Learning, Generative AI.')

        .pauseFor(2000)

        .deleteAll(10)

        .typeString('Always exploring new technologies.')

        .pauseFor(4000)

        .start();

    </script>

</body>

</html>
